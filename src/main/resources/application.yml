spring:
  datasource:
    url: jdbc:h2:file:./data/vectorgradebook;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

  application:
    name: VectorGradebook

ai:
  vectorstore:
    qdrant:
      host: localhost
      port: 6334
      initialize-schema: false

server:
  port: 8081

vaadin:
  whitelisted-packages: pl.ddconstruction.VectorGradebook.model
